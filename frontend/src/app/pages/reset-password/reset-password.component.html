<div class="login-shell">
  <!-- Columna izquierda: Hero (Consistente con Login) -->
  <div class="login-hero" role="img" aria-label="Campo de golf aéreo">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <div class="hero-logo">
        <img ngSrc="assets/logo-fairgreen.png" alt="FairGreen" width="64" height="64" priority style="border-radius:12px; object-fit: contain;">
      </div>
      <h1 class="hero-title">Restablecer Contraseña</h1>
      <p class="hero-subtitle">Control y Trazabilidad del estado<br>de Campos de Golf</p>
    </div>
    <div class="hero-pattern" aria-hidden="true">
      <svg viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="g1" cx="50%" cy="50%" r="70%">
            <stop offset="0%" stop-color="rgba(76,175,125,0.15)"/>
            <stop offset="100%" stop-color="rgba(28,61,46,0)"/>
          </radialGradient>
        </defs>
        <ellipse cx="400" cy="300" rx="380" ry="260" fill="url(#g1)"/>
        <path d="M100,400 Q200,320 350,380 Q500,440 650,360 Q750,300 800,340 L800,600 L100,600 Z" fill="rgba(28,61,46,0.4)"/>
        <path d="M0,450 Q150,380 300,430 Q450,480 600,410 Q700,360 800,390 L800,600 L0,600 Z" fill="rgba(28,61,46,0.55)"/>
      </svg>
    </div>
  </div>

  <!-- Columna derecha: Formulario -->
  <div class="login-form-col">
    <div class="login-form-wrapper">
      <div class="form-logo">
        <div class="form-logo-icon" aria-hidden="true">
          <img ngSrc="assets/logo-fairgreen.png" alt="FairGreen" width="32" height="32" priority style="border-radius:8px; object-fit: contain;">
        </div>
        <span class="form-logo-text">Fairgreen</span>
      </div>

      <h2 class="form-title">Nueva Contraseña</h2>
      <p class="form-subtitle">Ingresa y confirma tu nueva contraseña</p>

      @if (successMessage) {
        <div class="form-success" role="alert">
          {{ successMessage }}
        </div>
        <div style="margin-top: 20px;">
          <a routerLink="/login" class="btn-primary w-100 text-center" style="display: flex; text-decoration: none;">Ir al Inicio de Sesión</a>
        </div>
      } @else {
        <form (ngSubmit)="onSubmit()" #resetForm="ngForm" novalidate>
          <!-- Nueva Contraseña -->
          <div class="form-group">
            <label for="new-password-input" class="form-label">Nueva Contraseña</label>
            <div class="input-group">
              <span class="input-icon" aria-hidden="true">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </span>
              <input
                id="new-password-input"
                type="password"
                class="input-field"
                placeholder="••••••••"
                [(ngModel)]="newPassword"
                name="newPassword"
                required
                aria-required="true"
              />
            </div>
          </div>

          <!-- Confirmar Contraseña -->
          <div class="form-group">
            <label for="confirm-password-input" class="form-label">Confirmar Contraseña</label>
            <div class="input-group">
              <span class="input-icon" aria-hidden="true">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </span>
              <input
                id="confirm-password-input"
                type="password"
                class="input-field"
                placeholder="••••••••"
                [(ngModel)]="confirmPassword"
                name="confirmPassword"
                required
                aria-required="true"
              />
            </div>
          </div>

          @if (errorMessage) {
            <div class="form-error" role="alert">{{ errorMessage }}</div>
          }

          <button type="submit" class="btn-primary w-100" [disabled]="isLoading || !uidb64 || !token">
            @if (isLoading) {
              <span class="spinner" aria-hidden="true"></span>
              Cambiando contraseña...
            } @else {
              Restablecer Contraseña
            }
          </button>
        </form>

        <div class="back-to-login">
          <a routerLink="/login">Volver a Iniciar Sesión</a>
        </div>
      }
    </div>
  </div>
</div>
