<div class="login-shell">
  <!-- Columna izquierda: Hero (Igual al Login para consistencia) -->
  <div class="login-hero" role="img" aria-label="Campo de golf aéreo">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <div class="hero-logo">
        <img ngSrc="assets/logo-fairgreen.png" alt="FairGreen" width="64" height="64" priority style="border-radius:12px; object-fit: contain;">
      </div>
      <h1 class="hero-title">FAIRGREEN</h1>
      <p class="hero-subtitle">Control y Trazabilidad del estado<br>de Campos de Golf</p>
    </div>
    <div class="hero-pattern" aria-hidden="true">
      <svg viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="g1" cx="50%" cy="50%" r="70%">
            <stop offset="0%" stop-color="rgba(76,175,125,0.15)"/>
            <stop offset="100%" stop-color="rgba(28,61,46,0)"/>
          </radialGradient>
        </defs>
        <ellipse cx="400" cy="300" rx="380" ry="260" fill="url(#g1)"/>
        <path d="M100,400 Q200,320 350,380 Q500,440 650,360 Q750,300 800,340 L800,600 L100,600 Z" fill="rgba(28,61,46,0.4)"/>
        <path d="M0,450 Q150,380 300,430 Q450,480 600,410 Q700,360 800,390 L800,600 L0,600 Z" fill="rgba(28,61,46,0.55)"/>
      </svg>
    </div>
  </div>

  <!-- Columna derecha: Formulario -->
  <div class="login-form-col">
    <div class="login-form-wrapper">
      <div class="form-logo">
        <div class="form-logo-icon" aria-hidden="true">
          <img ngSrc="assets/logo-fairgreen.png" alt="FairGreen" width="32" height="32" priority style="border-radius:8px; object-fit: contain;">
        </div>
        <span class="form-logo-text">Fairgreen</span>
      </div>

      <h2 class="form-title">Recuperar Contraseña</h2>
      <p class="form-subtitle">Ingresa tu correo para recibir un enlace de restauración</p>

      @if (successMessage) {
        <div class="form-success" role="alert">
          {{ successMessage }}
        </div>
        <div style="margin-top: 20px;">
          <a routerLink="/login" class="btn-primary w-100 text-center" style="display: flex; text-decoration: none;">Volver al Inicio</a>
        </div>
      } @else {
        <form (ngSubmit)="onSubmit()" #forgotForm="ngForm" novalidate>
          <div class="form-group">
            <label for="email-input" class="form-label">Correo Electrónico</label>
            <div class="input-group">
              <span class="input-icon" aria-hidden="true">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                </svg>
              </span>
              <input
                id="email-input"
                type="email"
                class="input-field"
                placeholder="usuario@fairgreen.com"
                [(ngModel)]="email"
                name="email"
                required
                autocomplete="email"
                aria-required="true"
              />
            </div>
          </div>

          @if (errorMessage) {
            <div class="form-error" role="alert">{{ errorMessage }}</div>
          }

          <button type="submit" class="btn-primary w-100" [disabled]="isLoading">
            @if (isLoading) {
              <span class="spinner" aria-hidden="true"></span>
              Enviando enlace...
            } @else {
              Enviar Enlace
            }
          </button>
        </form>

        <div class="back-to-login">
          <a routerLink="/login">← Volver a Iniciar Sesión</a>
        </div>
      }
    </div>
  </div>
</div>
